name: Package portable FreeCAD for ChatGPT

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_headless_for_chatgpt.yml'

permissions:
  contents: read

jobs:
  package-freecad-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Download official FreeCAD 1.1.3 AppImage
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage'
          curl -fL --retry 5 --retry-delay 2 -o FreeCAD.AppImage "$URL"
          echo '3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage' | sha256sum -c -
          chmod +x FreeCAD.AppImage

      - name: Extract and smoke-test headless CAD modules
        shell: bash
        run: |
          set -euo pipefail
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          CMD="$(find "$PWD/squashfs-root" -type f \( -name FreeCADCmd -o -name freecadcmd \) -perm -111 | head -n1)"
          test -n "$CMD"
          echo "FreeCADCmd=$CMD"
          "$CMD" -c 'import FreeCAD, Part, PartDesign, Sketcher, Mesh; s=Part.makeBox(10,20,30); assert s.isValid(); assert abs(s.Volume-6000.0)<1e-6; print(FreeCAD.Version()); print("HEADLESS MODULES OK")'

      - name: Create portable extraction helper
        shell: bash
        run: |
          cat > README-CHATGPT.txt <<'EOF'
          Official FreeCAD 1.1.3 Linux x86_64 AppImage (Python 3.11).
          SHA256: 3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef

          In a container without FUSE:
            chmod +x FreeCAD.AppImage
            ./FreeCAD.AppImage --appimage-extract
            find squashfs-root -type f -name 'FreeCADCmd' -perm -111

          The GitHub Actions smoke test imports FreeCAD, Part, PartDesign, Sketcher and Mesh.
          EOF

      - name: Upload portable FreeCAD
        uses: actions/upload-artifact@v4
        with:
          name: freecad-1.1.3-linux-x86_64-appimage
          path: |
            FreeCAD.AppImage
            README-CHATGPT.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
