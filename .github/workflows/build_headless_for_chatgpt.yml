name: Build Headless FreeCAD for CAD checks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_headless_for_chatgpt.yml'

permissions:
  contents: read

env:
  PIXI_VERSION: v0.68.1

jobs:
  build-headless-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout FreeCAD including submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install repository Pixi environment
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true

      - name: Prepare headless Qt helpers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cMake/FreeCAD_Helpers/SetupQt.cmake')
          s = p.read_text()
          old = 'set(FREECAD_QT_COMPONENTS Core Concurrent Network Xml)'
          new = 'set(FREECAD_QT_COMPONENTS Core Concurrent Network Xml LinguistTools)'
          if old not in s:
              raise SystemExit('Expected SetupQt.cmake component line not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Configure headless FreeCAD
        shell: bash
        run: |
          pixi run bash -lc '
            cmake -S . -B build-headless -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$PWD/freecad-headless" \
              -DBUILD_GUI=OFF \
              -DBUILD_FEM=OFF \
              -DBUILD_TEMPLATE=OFF \
              -DBUILD_ADDONMGR=OFF \
              -DBUILD_BIM=OFF \
              -DBUILD_DRAFT=OFF \
              -DBUILD_HELP=OFF \
              -DBUILD_IMPORT=ON \
              -DBUILD_INSPECTION=OFF \
              -DBUILD_MATERIAL=ON \
              -DBUILD_MESH=ON \
              -DBUILD_MESH_PART=OFF \
              -DBUILD_FLAT_MESH=OFF \
              -DBUILD_OPENSCAD=OFF \
              -DBUILD_PART=ON \
              -DBUILD_PART_DESIGN=ON \
              -DBUILD_CAM=OFF \
              -DBUILD_ASSEMBLY=OFF \
              -DBUILD_PLOT=OFF \
              -DBUILD_POINTS=OFF \
              -DBUILD_REVERSEENGINEERING=OFF \
              -DBUILD_ROBOT=OFF \
              -DBUILD_SHOW=OFF \
              -DBUILD_SKETCHER=ON \
              -DBUILD_SPREADSHEET=OFF \
              -DBUILD_START=OFF \
              -DBUILD_TEST=OFF \
              -DBUILD_MEASURE=OFF \
              -DBUILD_TECHDRAW=OFF \
              -DBUILD_TUX=OFF \
              -DBUILD_WEB=OFF \
              -DBUILD_SURFACE=OFF \
              -DENABLE_DEVELOPER_TESTS=OFF \
              -DFREECAD_USE_PCL=OFF \
              -DFREECAD_USE_EXTERNAL_SMESH=OFF \
              -DBUILD_FEM_NETGEN=OFF \
              -DFREECAD_USE_3DCONNEXION_LEGACY=OFF \
              -DINSTALL_TO_SITEPACKAGES=OFF
          '

      - name: Build and install
        shell: bash
        run: |
          pixi run bash -lc '
            cmake --build build-headless --parallel 2
            cmake --install build-headless
          '

      - name: Smoke test in build environment
        shell: bash
        run: |
          pixi run bash -lc '
            export LD_LIBRARY_PATH="$PWD/freecad-headless/lib:$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            "$PWD/freecad-headless/bin/FreeCADCmd" -c "import FreeCAD, Part; s=Part.makeBox(10,20,30); print(FreeCAD.Version()); print(s.Volume); assert s.isValid(); assert abs(s.Volume-6000.0)<1e-6"
          '

      # FreeCAD and OpenCascade load a number of libraries and resource files at
      # runtime that are not visible in a simple `ldd FreeCADCmd` traversal.
      # Keep the complete Pixi runtime lib/share trees instead of guessing which
      # transitive plugins/resources a future CAD operation might need.
      - name: Collect self-contained runtime
        shell: bash
        run: |
          pixi run bash -lc '
            set -euo pipefail
            mkdir -p freecad-headless/runtime/bin
            cp -a "$CONDA_PREFIX/lib" freecad-headless/runtime/lib
            cp -a "$CONDA_PREFIX/share" freecad-headless/runtime/share
            cp -a "$CONDA_PREFIX/bin/python3.11" freecad-headless/runtime/bin/python3.11

            # Keep certificates and common OpenCascade/Qt runtime metadata if
            # supplied outside lib/share by a package.
            for d in ssl etc; do
              if [ -d "$CONDA_PREFIX/$d" ]; then
                cp -a "$CONDA_PREFIX/$d" "freecad-headless/runtime/$d"
              fi
            done
          '

      - name: Create launchers and CAD validation suite
        shell: bash
        run: |
          cat > freecad-headless/env.sh <<'EOF'
          #!/usr/bin/env bash
          FREECAD_PORTABLE_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export FREECAD_PORTABLE_ROOT
          export PATH="$FREECAD_PORTABLE_ROOT/runtime/bin:$FREECAD_PORTABLE_ROOT/bin${PATH:+:$PATH}"
          export LD_LIBRARY_PATH="$FREECAD_PORTABLE_ROOT/lib:$FREECAD_PORTABLE_ROOT/runtime/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PYTHONHOME="$FREECAD_PORTABLE_ROOT/runtime"
          export PYTHONPATH="$FREECAD_PORTABLE_ROOT/lib:$FREECAD_PORTABLE_ROOT/Mod${PYTHONPATH:+:$PYTHONPATH}"
          export XDG_DATA_DIRS="$FREECAD_PORTABLE_ROOT/runtime/share${XDG_DATA_DIRS:+:$XDG_DATA_DIRS}"
          [ -d "$FREECAD_PORTABLE_ROOT/runtime/lib/qt6/plugins" ] && export QT_PLUGIN_PATH="$FREECAD_PORTABLE_ROOT/runtime/lib/qt6/plugins"
          [ -f "$FREECAD_PORTABLE_ROOT/runtime/ssl/cacert.pem" ] && export SSL_CERT_FILE="$FREECAD_PORTABLE_ROOT/runtime/ssl/cacert.pem"
          unset CONDA_PREFIX CONDA_DEFAULT_ENV
          EOF

          cat > freecad-headless/freecad-python.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd "$(dirname "$0")" && pwd)"
          # shellcheck disable=SC1091
          source "$HERE/env.sh"
          exec "$HERE/runtime/bin/python3.11" "$@"
          EOF

          cat > freecad-headless/freecadcmd.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd "$(dirname "$0")" && pwd)"
          # shellcheck disable=SC1091
          source "$HERE/env.sh"
          exec "$HERE/bin/FreeCADCmd" "$@"
          EOF

          cat > freecad-headless/validate-cad.py <<'PY'
          """Portable FreeCAD acceptance test used by CI and after extraction."""
          from __future__ import annotations

          import math
          import os
          import tempfile
          from pathlib import Path

          import FreeCAD
          import Part


          def close_if_open(name: str) -> None:
              if FreeCAD.getDocument(name) is not None:
                  FreeCAD.closeDocument(name)


          with tempfile.TemporaryDirectory(prefix="freecad-portable-") as tmp:
              tmpdir = Path(tmp)
              fcstd = tmpdir / "roundtrip.FCStd"
              step = tmpdir / "roundtrip.step"
              stl = tmpdir / "roundtrip.stl"

              # Non-trivial BRep: fused box+cylinder with a through-hole.
              base = Part.makeBox(40, 30, 12)
              boss = Part.makeCylinder(8, 18, FreeCAD.Vector(20, 15, 12))
              hole = Part.makeCylinder(3, 30, FreeCAD.Vector(20, 15, 0))
              shape = base.fuse(boss).cut(hole)
              assert shape.isValid(), "constructed BRep is invalid"
              assert shape.Volume > 0
              bbox = shape.BoundBox
              assert math.isclose(bbox.XLength, 40.0, abs_tol=1e-7)
              assert math.isclose(bbox.YLength, 30.0, abs_tol=1e-7)
              assert math.isclose(bbox.ZLength, 30.0, abs_tol=1e-7)

              # Native FCStd save/reopen.
              doc = FreeCAD.newDocument("PortableRoundtrip")
              obj = doc.addObject("PartDesign::Feature", "Fixture")
              obj.Label = "Portable CAD validation fixture"
              obj.addProperty("App::PropertyLength", "ReferenceLength", "Validation")
              obj.ReferenceLength = 40
              obj.Shape = shape
              doc.recompute()
              doc.saveAs(str(fcstd))
              expected_volume = obj.Shape.Volume
              FreeCAD.closeDocument(doc.Name)

              reopened = FreeCAD.openDocument(str(fcstd))
              loaded = reopened.getObject("Fixture")
              assert loaded is not None
              assert loaded.Shape.isValid()
              assert math.isclose(loaded.Shape.Volume, expected_volume, rel_tol=0, abs_tol=1e-6)
              assert math.isclose(loaded.ReferenceLength.Value, 40.0, abs_tol=1e-9)
              FreeCAD.closeDocument(reopened.Name)

              # STEP export/import through OpenCascade.
              shape.exportStep(str(step))
              reread = Part.read(str(step))
              assert reread.isValid()
              assert math.isclose(reread.Volume, expected_volume, rel_tol=0, abs_tol=1e-3)

              # STL tessellation/export; verify that a non-empty mesh file exists.
              shape.exportStl(str(stl))
              assert stl.stat().st_size > 100

              print("FreeCAD version:", FreeCAD.Version())
              print("FCStd bytes:", fcstd.stat().st_size)
              print("STEP bytes:", step.stat().st_size)
              print("STL bytes:", stl.stat().st_size)
              print("Volume:", expected_volume)
              print("Portable FCStd + STEP + STL CAD validation OK")
          PY

          chmod +x freecad-headless/env.sh freecad-headless/freecad-python.sh freecad-headless/freecadcmd.sh

      - name: Test relocated artifact with clean environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/freecad-portable-test
          cp -a freecad-headless /tmp/freecad-portable-test

          # Poison/remove build-environment variables so accidental dependency
          # leakage from Pixi is caught here.
          env -i \
            HOME="$HOME" \
            USER="$USER" \
            PATH="/usr/bin:/bin" \
            LANG="C.UTF-8" \
            /tmp/freecad-portable-test/freecad-python.sh \
            /tmp/freecad-portable-test/validate-cad.py

          env -i \
            HOME="$HOME" \
            USER="$USER" \
            PATH="/usr/bin:/bin" \
            LANG="C.UTF-8" \
            /tmp/freecad-portable-test/freecadcmd.sh -c \
            "import FreeCAD, Part; s=Part.makeBox(2,3,4); assert s.isValid(); print(s.Volume); assert abs(s.Volume-24)<1e-6"

          # Fail if the packaged FreeCAD/runtime still references the runner's
          # Pixi environment in an ELF dependency path.
          if grep -RIl --binary-files=text "$GITHUB_WORKSPACE/.pixi" /tmp/freecad-portable-test/bin /tmp/freecad-portable-test/lib 2>/dev/null | head -1 | grep -q .; then
            echo "Found absolute build-environment prefix embedded in portable FreeCAD files" >&2
            grep -RIl --binary-files=text "$GITHUB_WORKSPACE/.pixi" /tmp/freecad-portable-test/bin /tmp/freecad-portable-test/lib 2>/dev/null | head -20 >&2
            exit 1
          fi

          du -sh freecad-headless | tee freecad-headless/ARTIFACT_SIZE.txt
          find freecad-headless \( -type f -o -type l \) -print | sort > freecad-headless/FILELIST.txt

      - name: Upload headless FreeCAD
        uses: actions/upload-artifact@v4
        with:
          name: freecad-headless-linux-x86_64
          path: freecad-headless/
          compression-level: 6
          retention-days: 14
          if-no-files-found: error
