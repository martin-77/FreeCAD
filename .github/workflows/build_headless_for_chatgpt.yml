name: Package portable FreeCAD for ChatGPT

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_headless_for_chatgpt.yml'

permissions:
  contents: read

jobs:
  package-freecad-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Download official FreeCAD 1.1.3 AppImage
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage'
          curl -fL --retry 5 --retry-delay 2 -o FreeCAD.AppImage "$URL"
          echo '3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef  FreeCAD.AppImage' | sha256sum -c -
          chmod +x FreeCAD.AppImage

      - name: Extract and smoke-test headless CAD modules
        shell: bash
        run: |
          set -euo pipefail
          ./FreeCAD.AppImage --appimage-extract >/dev/null
          CMD="$(find "$PWD/squashfs-root" -type f \( -name FreeCADCmd -o -name freecadcmd \) -perm -111 | head -n1)"
          test -n "$CMD"
          echo "FreeCADCmd=$CMD"
          "$CMD" -c 'import FreeCAD, Part, PartDesign, Sketcher, Mesh; s=Part.makeBox(10,20,30); assert s.isValid(); assert abs(s.Volume-6000.0)<1e-6; print(FreeCAD.Version()); print("HEADLESS MODULES OK")'

      - name: Split verified AppImage for connector transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir chunks
          split -b 190M -d -a 2 FreeCAD.AppImage chunks/FreeCAD.AppImage.part.
          test -f chunks/FreeCAD.AppImage.part.00
          test -f chunks/FreeCAD.AppImage.part.01
          test -f chunks/FreeCAD.AppImage.part.02
          test -f chunks/FreeCAD.AppImage.part.03
          test -f chunks/FreeCAD.AppImage.part.04
          cat chunks/FreeCAD.AppImage.part.* | sha256sum | grep -q '^3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef '
          ls -lh chunks

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: freecad-appimage-part-00
          path: chunks/FreeCAD.AppImage.part.00
          compression-level: 0
          retention-days: 14
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: freecad-appimage-part-01
          path: chunks/FreeCAD.AppImage.part.01
          compression-level: 0
          retention-days: 14
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: freecad-appimage-part-02
          path: chunks/FreeCAD.AppImage.part.02
          compression-level: 0
          retention-days: 14
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: freecad-appimage-part-03
          path: chunks/FreeCAD.AppImage.part.03
          compression-level: 0
          retention-days: 14
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: freecad-appimage-part-04
          path: chunks/FreeCAD.AppImage.part.04
          compression-level: 0
          retention-days: 14
