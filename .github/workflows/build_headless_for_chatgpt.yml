name: Build Headless FreeCAD for CAD checks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_headless_for_chatgpt.yml'

permissions:
  contents: read

env:
  PIXI_VERSION: v0.68.1

jobs:
  build-headless-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout FreeCAD including submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install repository Pixi environment
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true

      - name: Prepare headless Qt helpers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cMake/FreeCAD_Helpers/SetupQt.cmake')
          s = p.read_text()
          old = 'set(FREECAD_QT_COMPONENTS Core Concurrent Network Xml)'
          new = 'set(FREECAD_QT_COMPONENTS Core Concurrent Network Xml LinguistTools)'
          if old not in s:
              raise SystemExit('Expected SetupQt.cmake component line not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Configure headless FreeCAD
        shell: bash
        run: |
          pixi run bash -lc '
            cmake -S . -B build-headless -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$PWD/freecad-headless" \
              -DBUILD_GUI=OFF \
              -DBUILD_FEM=OFF \
              -DBUILD_TEMPLATE=OFF \
              -DBUILD_ADDONMGR=OFF \
              -DBUILD_BIM=OFF \
              -DBUILD_DRAFT=OFF \
              -DBUILD_HELP=OFF \
              -DBUILD_IMPORT=ON \
              -DBUILD_INSPECTION=OFF \
              -DBUILD_MATERIAL=ON \
              -DBUILD_MESH=ON \
              -DBUILD_MESH_PART=OFF \
              -DBUILD_FLAT_MESH=OFF \
              -DBUILD_OPENSCAD=OFF \
              -DBUILD_PART=ON \
              -DBUILD_PART_DESIGN=ON \
              -DBUILD_CAM=OFF \
              -DBUILD_ASSEMBLY=OFF \
              -DBUILD_PLOT=OFF \
              -DBUILD_POINTS=OFF \
              -DBUILD_REVERSEENGINEERING=OFF \
              -DBUILD_ROBOT=OFF \
              -DBUILD_SHOW=OFF \
              -DBUILD_SKETCHER=ON \
              -DBUILD_SPREADSHEET=OFF \
              -DBUILD_START=OFF \
              -DBUILD_TEST=OFF \
              -DBUILD_MEASURE=OFF \
              -DBUILD_TECHDRAW=OFF \
              -DBUILD_TUX=OFF \
              -DBUILD_WEB=OFF \
              -DBUILD_SURFACE=OFF \
              -DENABLE_DEVELOPER_TESTS=OFF \
              -DFREECAD_USE_PCL=OFF \
              -DFREECAD_USE_EXTERNAL_SMESH=OFF \
              -DBUILD_FEM_NETGEN=OFF \
              -DFREECAD_USE_3DCONNEXION_LEGACY=OFF \
              -DINSTALL_TO_SITEPACKAGES=OFF
          '

      - name: Build and install
        shell: bash
        run: |
          pixi run bash -lc '
            cmake --build build-headless --parallel 2
            cmake --install build-headless
          '

      - name: Smoke test in build environment
        shell: bash
        run: |
          pixi run bash -lc '
            export LD_LIBRARY_PATH="$PWD/freecad-headless/lib:$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            "$PWD/freecad-headless/bin/FreeCADCmd" -c "import FreeCAD, Part; s=Part.makeBox(10,20,30); print(FreeCAD.Version()); print(s.Volume); assert abs(s.Volume-6000.0)<1e-6"
          '

      - name: Collect portable runtime
        shell: bash
        run: |
          pixi run python - <<'PY'
          import os, pathlib, re, shutil, subprocess

          root = pathlib.Path('freecad-headless').resolve()
          prefix = pathlib.Path(os.environ['CONDA_PREFIX']).resolve()
          runtime = root / 'runtime-lib'
          runtime.mkdir(exist_ok=True)

          def is_elf(p):
              try:
                  return p.is_file() and p.read_bytes()[:4] == b'\x7fELF'
              except OSError:
                  return False

          queue = [p for p in root.rglob('*') if is_elf(p)]
          pyroot = root / 'python'
          (pyroot / 'bin').mkdir(parents=True, exist_ok=True)
          pyexe_src = prefix / 'bin' / 'python3.11'
          pyexe_dst = pyroot / 'bin' / 'python3.11'
          shutil.copy2(pyexe_src, pyexe_dst)
          queue.append(pyexe_dst)

          seen = set()
          copied = {}
          aliases = {}
          dep_re = re.compile(r'^\s*([^\s]+)\s+=>\s+(/[^ ]+)', re.M)

          while queue:
              obj = queue.pop()
              try:
                  key = str(obj.resolve())
              except OSError:
                  continue
              if key in seen:
                  continue
              seen.add(key)
              try:
                  out = subprocess.check_output(['ldd', str(obj)], text=True, stderr=subprocess.STDOUT)
              except Exception:
                  continue
              for m in dep_re.finditer(out):
                  needed_name, dep_path = m.group(1), pathlib.Path(m.group(2))
                  try:
                      dep_res = dep_path.resolve()
                  except OSError:
                      continue
                  if not str(dep_res).startswith(str(prefix) + os.sep):
                      continue
                  real_name = dep_res.name
                  dst = runtime / real_name
                  if real_name not in copied:
                      shutil.copy2(dep_res, dst)
                      copied[real_name] = str(dep_res)
                      queue.append(dst)
                  if needed_name != real_name:
                      aliases[needed_name] = real_name

          # GitHub Actions artifacts do not preserve symlink semantics reliably.
          # Store every SONAME alias as a real file so the downloaded artifact
          # still contains loader-visible names such as libQt6Core.so.6.
          for alias, target in sorted(aliases.items()):
              alias_path = runtime / alias
              target_path = runtime / target
              if alias_path.exists() or alias_path.is_symlink():
                  alias_path.unlink()
              shutil.copy2(target_path, alias_path)

          py_src = prefix / 'lib' / 'python3.11'
          py_dst = pyroot / 'lib' / 'python3.11'
          def ignore(path, names):
              blocked = {'site-packages', 'test', 'tests', 'tkinter', 'idlelib', 'ensurepip'}
              return [n for n in names if n in blocked or n == '__pycache__']
          shutil.copytree(py_src, py_dst, dirs_exist_ok=True, ignore=ignore)

          (root / 'RUNTIME_LIBS.txt').write_text(
              '\n'.join(f'{k}\t{v}' for k, v in sorted(copied.items())) + '\n', encoding='utf-8')
          (root / 'RUNTIME_ALIASES.txt').write_text(
              '\n'.join(f'{k}\t{v}' for k, v in sorted(aliases.items())) + '\n', encoding='utf-8')
          print(f'Copied {len(copied)} runtime libraries and materialized {len(aliases)} aliases')
          PY

      - name: Create portable launchers and test artifact
        shell: bash
        run: |
          cat > freecad-headless/freecadcmd.sh <<'EOF'
          #!/usr/bin/env bash
          set -e
          HERE="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/runtime-lib:$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PYTHONHOME="$HERE/python"
          export PYTHONPATH="$HERE/lib:$HERE/Mod${PYTHONPATH:+:$PYTHONPATH}"
          exec "$HERE/bin/FreeCADCmd" "$@"
          EOF

          cat > freecad-headless/freecad-python.sh <<'EOF'
          #!/usr/bin/env bash
          set -e
          HERE="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/runtime-lib:$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PYTHONHOME="$HERE/python"
          export PYTHONPATH="$HERE/lib:$HERE/Mod${PYTHONPATH:+:$PYTHONPATH}"
          exec "$HERE/python/bin/python3.11" "$@"
          EOF
          chmod +x freecad-headless/freecadcmd.sh freecad-headless/freecad-python.sh

          rm -rf /tmp/freecad-portable-test
          cp -a freecad-headless /tmp/freecad-portable-test
          env -u CONDA_PREFIX -u PYTHONPATH -u PYTHONHOME \
            LD_LIBRARY_PATH="" \
            /tmp/freecad-portable-test/freecadcmd.sh -c \
            "import FreeCAD, Part; s=Part.makeCylinder(6.21,20); print(FreeCAD.Version()); assert s.Volume>2400"

          env -u CONDA_PREFIX -u PYTHONPATH -u PYTHONHOME \
            LD_LIBRARY_PATH="" \
            /tmp/freecad-portable-test/freecad-python.sh - <<'PY'
          import os, sys, tempfile
          import FreeCAD, Part
          assert '/home/runner/' not in sys.prefix, sys.prefix
          shape = Part.makeBox(10, 20, 30)
          assert abs(shape.Volume - 6000.0) < 1e-6
          fd, path = tempfile.mkstemp(suffix='.step')
          os.close(fd)
          try:
              shape.exportStep(path)
              reread = Part.read(path)
              assert reread.isValid()
              assert abs(reread.Volume - 6000.0) < 1e-4
          finally:
              os.unlink(path)
          print('Portable Python + FreeCAD + STEP roundtrip OK')
          PY

          du -sh freecad-headless | tee freecad-headless/ARTIFACT_SIZE.txt
          find freecad-headless -type f -o -type l | sort > freecad-headless/FILELIST.txt

      - name: Upload headless FreeCAD
        uses: actions/upload-artifact@v4
        with:
          name: freecad-headless-linux-x86_64
          path: freecad-headless/
          compression-level: 6
          retention-days: 14
          if-no-files-found: error
